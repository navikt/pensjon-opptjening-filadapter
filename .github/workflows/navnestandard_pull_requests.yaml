name: Validate PR Title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  validate-pr-title:
    runs-on: ubuntu-latest

    steps:
      - name: Check PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ ! "$PR_TITLE" =~ ^#(nf|tm).+ ]]; then
            echo "Ugyldig navn på PR, må starte med kode for opphav (#nf eller #tm)"
            exit 1
          fi

          echo "Gyldig PR-navn: $PR_TITLE"
